name: abcd_architecture_flutter
description: "ABCD Architecture Flutter 2.0 — Ship apps in days, not weeks."
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management (Riverpod)
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^14.8.1

  # Data / Models
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Local Storage (Hive CE — fast offline caching)
  hive_ce: ^2.19.3
  hive_ce_flutter: ^2.3.4

  # Firebase (delete if not using)
  firebase_core: ^3.13.0
  firebase_analytics: ^11.4.4
  firebase_auth: ^5.6.4
  cloud_firestore: ^5.6.7
  firebase_storage: ^12.4.4
  firebase_messaging: ^15.2.4
  firebase_crashlytics: ^4.3.5
  firebase_app_check: ^0.3.2+5
  google_sign_in: ^6.2.2
  sign_in_with_apple: ^6.1.4
  crypto: ^3.0.6

  # Supabase (delete if not using)
  supabase_flutter: ^2.9.0

  # HTTP (delete if not using)
  dio: ^5.7.0

  # Monetization
  google_mobile_ads: ^5.3.0
  in_app_purchase: ^3.2.0

  # Utils
  uuid: ^4.5.1
  intl: ^0.19.0
  timeago: ^3.7.0
  connectivity_plus: ^6.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.14
  freezed: ^2.5.8
  json_serializable: ^6.9.4

flutter:
  uses-material-design: true
  assets:
    - assets/
